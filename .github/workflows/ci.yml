name: CI & Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push cancels an older pull request run, but never a run on main:
# cancelling a release halfway through could leave a tag without assets.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Build & Test
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Swift version
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  # Decides whether this push to main ships a release. A release happens when the
  # version in the Xcode project has no tag yet. Merging a pull request that does
  # not bump the version runs tests only.
  detect-release:
    name: Detect release
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.gate.outputs.should_release }}
      version: ${{ steps.info.outputs.version }}
      build: ${{ steps.info.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: info
        run: python3 -I script/release_info.py | tee -a "$GITHUB_OUTPUT"
      - id: gate
        env:
          VERSION: ${{ steps.info.outputs.version }}
          BUILD: ${{ steps.info.outputs.build }}
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null; then
            echo "Version ${VERSION} is already tagged: tests only, no release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ ! -f "release-notes/${VERSION}.md" ]; then
            echo "::error::Version ${VERSION} has no tag and no release-notes/${VERSION}.md. Add the notes, or revert the version bump."
            exit 1
          fi
          LATEST_BUILD="$(grep -o '<sparkle:version>[0-9]*</sparkle:version>' appcast.xml | head -1 | grep -o '[0-9]*' || echo 0)"
          if [ "${BUILD}" -le "${LATEST_BUILD}" ]; then
            echo "::error::Build ${BUILD} must be greater than the latest published build ${LATEST_BUILD}. Sparkle only offers higher build numbers."
            exit 1
          fi
          echo "Releasing ${VERSION} (build ${BUILD})."
          echo "should_release=true" >> "$GITHUB_OUTPUT"

  # Signs with Developer ID, notarizes the app and the DMG, publishes the GitHub
  # release with its tag, then commits the regenerated Sparkle appcast to main.
  # Runs in the "release" environment so its secrets can be protected there.
  release:
    name: Release
    needs: detect-release
    if: needs.detect-release.outputs.should_release == 'true'
    # The project uses Xcode's JSON project format, which needs Xcode 27: the
    # hosted `xcode-27` image provides it. Repository variable RELEASE_RUNNER can
    # point to another runner, for example a self-hosted Mac, and RELEASE_XCODE
    # selects another Xcode. The default is 27.2, which reads the JSON project.
    runs-on: ${{ vars.RELEASE_RUNNER || 'xcode-27' }}
    environment: release
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.detect-release.outputs.version }}
      BUILD: ${{ needs.detect-release.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ vars.RELEASE_XCODE || '27.2' }}
      - name: Show Xcode
        run: xcodebuild -version

      - name: Import Developer ID certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.DEVELOPER_ID_CERT_P12 }}
          p12-password: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}

      - name: Write signing keys
        env:
          API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          SPARKLE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$SPARKLE_KEY" > "$RUNNER_TEMP/sparkle_ed_key"

      - name: Build, sign, notarize, package DMG and appcast
        env:
          NOTARY_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          NOTARY_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          SPARKLE_ED_KEY_FILE: ${{ runner.temp }}/sparkle_ed_key
        run: ./script/package_release.sh

      - name: Check the artifacts
        run: |
          set -euo pipefail
          test -f "dist/release/LittleTidy-${VERSION}-build-${BUILD}.dmg"
          test -f dist/release/LittleTidy.zip
          grep -q "<sparkle:shortVersionString>${VERSION}</sparkle:shortVersionString>" appcast.xml
          xcrun stapler validate "dist/release/LittleTidy-${VERSION}-build-${BUILD}.dmg"

      - name: Remove signing keys
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/sparkle_ed_key"

      # The tag is created here, on the exact commit that was built. The Sparkle
      # appcast already points at releases/download/v<version>/LittleTidy.zip.
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${VERSION}" \
            --target "$GITHUB_SHA" \
            --title "LittleTidy ${VERSION}" \
            --notes-file "release-notes/${VERSION}.md" \
            "dist/release/LittleTidy-${VERSION}-build-${BUILD}.dmg" \
            "dist/release/LittleTidy.dmg" \
            "dist/release/LittleTidy.zip"

      # Updates are offered only after the assets exist.
      - name: Publish Sparkle appcast
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add appcast.xml
          git commit -m "Publish ${VERSION} Sparkle appcast [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
