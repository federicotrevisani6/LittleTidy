name: LittleTidy
options:
  minimumXcodeGenVersion: 2.41.0
  deploymentTarget:
    macOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 3VU7K9SUV8
    ENABLE_HARDENED_RUNTIME: YES
    MARKETING_VERSION: "0.5.0"
    CURRENT_PROJECT_VERSION: "7"
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.0.0
targets:
  LittleTidyCore:
    type: framework
    platform: macOS
    sources:
      - path: Sources/LittleTidyCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.federicotrevisani.LittleTidyCore
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
  LittleTidy:
    type: application
    platform: macOS
    sources:
      - path: Sources/LittleTidy
    dependencies:
      - target: LittleTidyCore
      - package: Sparkle
    info:
      path: Sources/LittleTidy/Info.plist
      properties:
        CFBundleDisplayName: LittleTidy
        CFBundleName: LittleTidy
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: "26.0"
        NSPrincipalClass: NSApplication
        SUFeedURL: "https://raw.githubusercontent.com/federicotrevisani6/LittleTidy/main/appcast.xml"
        SUPublicEDKey: "V3UOM0vjv6Otk0SnW7hRKeB7H/XsC9DC3LR6c9Ug+jQ="
        SUEnableInstallerLauncherService: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.federicotrevisani.LittleTidy
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SKIP_INSTALL: NO
  LittleTidyQA:
    type: tool
    platform: macOS
    sources:
      - path: Sources/LittleTidyQA
    dependencies:
      - target: LittleTidyCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.federicotrevisani.LittleTidyQA
        SKIP_INSTALL: YES
  LittleTidyCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/LittleTidyCoreTests
    dependencies:
      - target: LittleTidyCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.federicotrevisani.LittleTidyCoreTests
        GENERATE_INFOPLIST_FILE: YES
  LittleTidyTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/LittleTidyTests
    dependencies:
      - target: LittleTidy
      - target: LittleTidyCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.federicotrevisani.LittleTidyTests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  LittleTidy:
    build:
      targets:
        LittleTidy: all
        LittleTidyQA: [run, test]
        LittleTidyCoreTests: [test]
    run:
      config: Debug
      executable: LittleTidy
    test:
      config: Debug
      targets:
        - LittleTidyCoreTests
        - LittleTidyTests
